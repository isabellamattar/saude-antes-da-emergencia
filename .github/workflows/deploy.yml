
name: CD - Deploy no Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    if: vars.ENABLE_CLOUD_DEPLOY == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Autenticar no Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/847963892157/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deploy@vicky-290611.iam.gserviceaccount.com
          token_format: access_token

      - name: Configurar Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Autenticar Docker no Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: southamerica-east1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Construir e enviar imagem
        working-directory: api
        run: |
          docker build -t southamerica-east1-docker.pkg.dev/vicky-290611/saude-api/saude-api:${{ github.sha }} .
          docker push southamerica-east1-docker.pkg.dev/vicky-290611/saude-api/saude-api:${{ github.sha }}

      - name: Implantar no Cloud Run
        run: >
          gcloud run deploy saude-api
          --image southamerica-east1-docker.pkg.dev/vicky-290611/saude-api/saude-api:${{ github.sha }}
          --region southamerica-east1
          --platform managed
          --service-account saude-api-runtime@vicky-290611.iam.gserviceaccount.com
          --allow-unauthenticated
